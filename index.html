<!DOCTYPE html>
<!-- this will tell browser which language we will use (for validator) -->
<html lang="en">

<head>
    <meta charset="UTF-8">

    <!-- This helps the website fit different screen sizes -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- The title appears in the browser tab -->
    <title>Midterm Project</title>

    <!-- load fonts from google fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Karla:wght@400;700&family=Lato:wght@400;700;900&display=swap"
        rel="stylesheet">

    <!-- link the html to the css file -->
    <link rel="stylesheet" href="css/main.css">
</head>

<body>

    <!-- Allows keyboard users to skip the navigation -->
    <a href="#main" class="skip">Skip to main content</a>

    <!--this section will cantain navbar -->

    <header>
        <div class="wrapper top">

            <!-- The logo is linked to the home page evry time we click it it take to home-->
            <a href="index.html">
                <img src="images/my-coffee-shop-logo.svg" alt="My Coffee House">
            </a>

            <!-- Navigation links for the main sections in our page -->
            <nav aria-label="Main navigation">
                <ul class="nav">
                    <li><a href="#about">About Us</a></li>
                    <li><a href="#menu">Menu</a></li>
                    <li><a href="#locations">Locations</a></li>
                </ul>
            </nav>

        </div>
    </header>


    <!-- This will contain the main sections of the website -->
    <main id="main">

        <!-- This section is the first part visitors see the hero section -->
        <section class="banner">
            <div class="wrapper">
                <div class="intro">
                    <h1>Experience coffee like never before</h1>

                    <p>
                        We craft more than beverages; we curate memories,
                        one flavorful moment at a time. Embrace the aroma
                        and let every visit be a chapter in your coffee story.
                    </p>

                    <a href="#menu" class="button">Explore our menu</a>
                </div>
            </div>
        </section>

    </main>

    <!-- This will contain the copyright information -->
    <footer>
    </footer>

</body>

</html>
